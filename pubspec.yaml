name: cryptoclinic_pay
description: Bitcoin payment and tax compliance app for US & Nigeria.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  breez_sdk: ^0.1.0 # Lightning integration (adapt from official)
  http: ^1.0.0
  intl: ^0.19.0
  hive: ^2.2.3 # Offline DB
  hive_flutter: ^1.1.0
  qr_flutter: ^4.1.0
  pdf: ^3.10.0 # Receipt PDF
  dio: ^5.0.0 # API calls

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true